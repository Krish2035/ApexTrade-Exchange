apiVersion: v1
kind: ConfigMap
metadata:
  name: apextrade-config
  namespace: apextrade-prod
data:
  NODE_ENV: "production"
  PORT: "4000"
  WS_PORT: "4001"
  GATEWAY_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: apextrade-secrets
  namespace: apextrade-prod
type: Opaque
stringData:
  JWT_SECRET: "apex_trade_ultra_secure_jwt_secret_key_2026_prod"
  DATABASE_URL: "postgres://apex_admin:apex_secret_prod@postgres-service:5432/apextrade"
