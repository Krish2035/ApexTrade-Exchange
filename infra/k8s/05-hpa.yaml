apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apextrade-backend-hpa
  namespace: apextrade-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apextrade-backend-deployment
  minReplicas: 2
  maxReplicas: 10 # (#45 Autoscaling, #46 Horizontal Scaling)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
