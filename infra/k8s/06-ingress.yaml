apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apextrade-ingress
  namespace: apextrade-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod # (#71 TLS Certificate Auto-Provisioning)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "apextrade-gateway-service"
spec:
  tls:
    - hosts:
        - api.apextrade.io
        - terminal.apextrade.io
      secretName: apextrade-tls-cert
  rules:
    - host: api.apextrade.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apextrade-gateway-service
                port:
                  number: 8080
