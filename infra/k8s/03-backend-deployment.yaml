apiVersion: apps/v1
kind: Deployment
metadata:
  name: apextrade-backend-deployment
  namespace: apextrade-prod
  labels:
    app: apextrade-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate # (#54 Rolling Deployments, #55 Rollbacks)
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: apextrade-backend
  template:
    metadata:
      labels:
        app: apextrade-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/api/v1/metrics/prometheus"
    spec:
      containers:
        - name: backend-core
          image: apextrade/backend:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: apextrade-config
            - secretRef:
                name: apextrade-secrets
          ports:
            - containerPort: 4000
              name: http-api
            - containerPort: 4001
              name: ws-feed
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # (#57 Liveness & Readiness Probes)
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apextrade-backend-service
  namespace: apextrade-prod
spec:
  type: ClusterIP
  selector:
    app: apextrade-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
    - name: websocket
      port: 4001
      targetPort: 4001
