apiVersion: apps/v1
kind: Deployment
metadata:
  name: apextrade-gateway-deployment
  namespace: apextrade-prod
  labels:
    app: apextrade-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apextrade-gateway
  template:
    metadata:
      labels:
        app: apextrade-gateway
    spec:
      containers:
        - name: gateway-ingress
          image: apextrade/gateway:v1.0.0
          ports:
            - containerPort: 8080
              name: gateway-port
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apextrade-gateway-service
  namespace: apextrade-prod
spec:
  type: LoadBalancer # (#3 Load Balancing)
  selector:
    app: apextrade-gateway
  ports:
    - name: gateway-traffic
      port: 8080
      targetPort: 8080
